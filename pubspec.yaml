name: employee_attendance
description: تطبيق تسجيل حضور الموظفين - Flutter Mobile App with SQLite Database

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2
  intl: ^0.19.0
  
  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  
  # State Management
  provider: ^6.1.0
  
  # Navigation
  go_router: ^13.0.0
  
  # Utils
  uuid: ^4.0.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_linter: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # Fonts with Arabic support
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
